
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A gallery of different website examples.">
    <title>Project Gallery | GRIDS APPS</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="header">
        <h1>Our Project Gallery</h1>

        <p>
            Here are some examples of websites that can be
            created for different purposes.
        </p>
    </header>

    <main class="main-content">

        <section class="gallery-section">
            <h2>Website Examples</h2>

            <div class="gallery-grid">

                <figure class="gallery-item">
                    <img src="images/business.png"
                         alt="Example of a business website homepage"
                         width="350">

                    <figcaption>
                        Business Website - A website for companies to
                        introduce their business, show their services,
                        and help customers contact them easily.
                    </figcaption>
                </figure>

                <figure class="gallery-item">
                    <img src="images/shop.png"
                         alt="Example of an online store with products"
                         width="350">

                    <figcaption>
                        Online Store - A website where customers can
                        explore products, check prices, and buy
                        what they need online.
                    </figcaption>
                </figure>

                <figure class="gallery-item">
                    <img src="images/blog.png"
                         alt="Example of a blog website with articles"
                         width="350">

                    <figcaption>
                        Blog Website - A place to share articles,
                        useful tips, and news about different topics.
                        Visitors can read and learn new things.
                    </figcaption>
                </figure>

                <figure class="gallery-item">
                    <img src="images/portfolio.png"
                         alt="Example of a personal portfolio website"
                         width="350">

                    <figcaption>
                        Portfolio Website - A personal website used
                        to show skills, projects, and previous work.
                        It helps people learn more about the developer.
                    </figcaption>
                </figure>

            </div>

        </section>

    </main>

    <footer class="footer">
        <p>&copy; 2026 GRIDS APPS. Training Project.</p>
    </footer>

</body>
</html>
